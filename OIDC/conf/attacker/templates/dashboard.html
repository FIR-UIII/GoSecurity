<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Attacker dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 780px; margin: 40px auto; color: #eee; background:#1b1b1b; }
    .card { border: 1px solid #444; border-radius: 8px; padding: 20px; margin-bottom: 16px; background:#242424; }
    pre { background: #0d1117; color: #ff6b6b; padding: 14px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>💀 Stolen session</h1>
  <div class="card">
    <p>Attacker's server exchanged the intercepted authorization code for tokens.</p>
    <h3>Stolen ID token claims</h3>
    <pre>{{.ClaimsJSON}}</pre>
    <h3>Stolen access token</h3>
    <pre>{{.AccessToken}}</pre>
  </div>
</body>
</html>
