# ============================================================================
# config.new.yaml — RADIUS methodology: structural fuzzing (type: fuzz) +
# Access-Challenge/OTP fuzzing (type: challenge).
#
# Target assumptions (fill in real addr/secret before running):
#   - PAP only. No CHAP/EAP/MS-CHAP support expected from the server.
#   - Two supported auth flows:
#       Flow A ("separate OTP"): first Access-Request carries only the
#         user's password in User-Password -> server replies
#         Access-Challenge -> second Access-Request carries just the OTP
#         (State echoed back) -> Access-Accept/Reject.
#       Flow B ("concatenated"): a single Access-Request carries
#         password+OTP concatenated in one User-Password value, e.g.
#         password "123" + OTP "123456" => User-Password value "123123456".
#         There is no second round-trip in this flow, so OTP fuzzing here
#         is done as ordinary attribute/value fuzzing (type: fuzz /
#         marked_range), NOT type: challenge (which assumes a real second
#         request against a State).
#
# This is a template/methodology file — only run against a server/account
# you are authorized to test. See client/v2/README.md for the full schema
# of each scenario type (raw | packet | fuzz | challenge).
# ============================================================================

addr: "localhost:1812"
secret: "MyRadiusSecret123"
timeout: 5s

scenarios:
  # ==========================================================================
  # PART 1 — type: fuzz
  # ==========================================================================

  # --------------------------------------------------------------------
  # 1.1 Header Code sweep, 0-255 (`type: packet`, one request per code).
  #     `type: fuzz`'s mutators never touch the header Code byte, so a
  #     full 0-255 sweep of it has to be done with plain `packet`
  #     scenarios instead - this is the exhaustive complement to the
  #     mutator-driven fuzzing below. Only 1 (Access-Request), 11
  #     (Access-Challenge-as-request, invalid direction), 12/13
  #     (Status-Server/Client) are meaningful RADIUS request codes;
  #     everything else (including reserved/unassigned values and
  #     response-only codes like 2/3/5 sent AS a request) should, per
  #     RFC 2865 SS4.1, either be silently dropped or rejected - never
  #     answered as if it were a normal Access-Request. No response:
  #     assertion is set here on purpose (behavior varies by
  #     implementation and isn't nailed down by the RFC for the
  #     unassigned range) - diff the logged responses across the sweep
  #     for any code that unexpectedly returns Access-Accept.
  # --------------------------------------------------------------------
  - name: "code-sweep-000"
    type: packet
    code: 0
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
  - name: "code-sweep-001"
