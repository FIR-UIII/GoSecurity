  # 1.2 Attribute-type sweep, 0-255 (`type: packet`, one extra attribute
  #     per iteration). Complements the code sweep above: exercises how
  #     the parser handles every possible attribute type octet,
  #     including gaps/reserved values not in this tool's own
  #     dictionary.go (parsed as "unknown type N" on both sides). The
  #     extra attribute's value is always an explicit hex: literal
  #     ("FUZZ" ASCII, 46555a5a) so it never triggers a type-specific
  #     encoding path (IPv4 auto-encode, PAP encryption, auto-computed
  #     Message-Authenticator) - keeps every iteration structurally
  #     identical except for the type octet itself. Types 1/2/80 in this
  #     sweep double as a cheap duplicate-attribute check (a second
