  # --------------------------------------------------------------------
  # 1.3 Duplicate-attribute scenarios - explicit, hand-picked cases
  #     (beyond the incidental 1/2/80 coverage in 1.2 above).
  # --------------------------------------------------------------------

  - name: "duplicate-user-name-same-value"
    type: packet
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    # no response: - observational: does the server use the first
    # User-Name, the last, concatenate them, or reject outright?

  - name: "duplicate-user-name-different-values"
    type: packet
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Name
        value: "definitely-not-a-real-user-abcxyz"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    # no response: - if the server authenticates against whichever
    # User-Name it picks, this also probes a request-smuggling-style
    # confusion between "the name it checked" and "the name it logs"

  - name: "duplicate-user-password-different-values"
    type: packet
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: User-Password
        value: "totally-wrong-password"
      - type: Message-Authenticator
    # no response: - each User-Password is independently PAP-encrypted
    # against the same Authenticator by this tool; observe which one
    # (first/last/either) the server actually checks

  - name: "duplicate-nas-identifier"
    type: packet
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: NAS-Identifier
        value: "some-other-nas"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    response: Accept   # NAS-Identifier duplication shouldn't affect auth
                        # outcome at all if the server is well-behaved

  - name: "many-duplicates-same-attribute"
    type: packet
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "dup-2"
      - type: NAS-Identifier
        value: "dup-3"
      - type: NAS-Identifier
        value: "dup-4"
      - type: NAS-Identifier
        value: "dup-5"
      - type: NAS-Identifier
        value: "dup-6"
      - type: NAS-Identifier
        value: "dup-7"
      - type: NAS-Identifier
        value: "dup-8"
      - type: Message-Authenticator
    # no response: - looks for O(n^2)/allocation issues or a crash when
    # one attribute type appears many times in a single packet

  - name: "fuzz-duplicate-strategy-flow-a"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    iterations: 100
    strategies:
      - strategy: duplicate
        target: User-Name
      - strategy: duplicate
        target: NAS-Identifier
      - strategy: duplicate
        target: User-Password
      - strategy: duplicate
        target: Message-Authenticator
    baseline_response: Challenge   # this server always challenges a valid
                                    # first request (Flow A) rather than
                                    # single-shot accepting

  # --------------------------------------------------------------------
  # 1.4 Structural mutation fuzzing, default mutator rotation, against
  #     both supported flows.
  # --------------------------------------------------------------------

  - name: "fuzz-default-mutators-flow-a"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    iterations: 500
    # strategies omitted - full default rotation: length_mismatch,
    # duplicate, missing_required, oversized_value, empty_value,
    # unknown_type, bit_flip, truncate, message_authenticator_tamper,
    # marked_range (no-op here, no <FUZZ> marker present)
    baseline_response: Challenge
    healthcheck_every: 20
    expect_no_accept: true

  - name: "fuzz-default-mutators-flow-b-concatenated"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123123456"        # password "123" + OTP "123456" concatenated
      - type: Message-Authenticator
    iterations: 500
    baseline_response: Accept     # Flow B is single-shot: a valid
                                   # password+OTP concatenation should
                                   # Accept directly, no Challenge
    healthcheck_every: 20
    expect_no_accept: true

  - name: "fuzz-targeted-message-authenticator-flow-a"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    iterations: 100
    strategies:
      - strategy: message_authenticator_tamper
      - strategy: bit_flip
        target: Message-Authenticator
      - strategy: truncate
        target: Message-Authenticator
      - strategy: length_mismatch
        target: Message-Authenticator
    baseline_response: Challenge

  - name: "fuzz-targeted-user-password-flow-a"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    iterations: 200
    strategies:
      - strategy: length_mismatch
        target: User-Password
      - strategy: bit_flip
        target: User-Password
      - strategy: truncate
        target: User-Password
      - strategy: oversized_value
        target: User-Password
      - strategy: empty_value
        target: User-Password
    baseline_response: Challenge   # a corrupted ciphertext should always
                                    # come back Reject, never Accept/Challenge

  - name: "fuzz-targeted-user-password-flow-b"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123123456"
      - type: Message-Authenticator
    iterations: 200
    strategies:
      - strategy: length_mismatch
        target: User-Password
      - strategy: bit_flip
        target: User-Password
      - strategy: truncate
        target: User-Password
      - strategy: oversized_value
        target: User-Password
      - strategy: empty_value
        target: User-Password
    baseline_response: Accept

  - name: "fuzz-vendor-specific-attribute"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Vendor-Specific
        value: "hex:0000000900110c0104036172740000"   # arbitrary vendor-id/type/data
      - type: Message-Authenticator
    iterations: 150
    strategies:
      - strategy: length_mismatch
        target: Vendor-Specific
      - strategy: bit_flip
        target: Vendor-Specific
      - strategy: truncate
        target: Vendor-Specific
      - strategy: oversized_value
        target: Vendor-Specific
      - strategy: empty_value
        target: Vendor-Specific
    baseline_response: Challenge   # a garbage/unknown Vendor-Specific
                                    # attribute must not itself break
                                    # normal PAP auth

  # --------------------------------------------------------------------
  # 1.5 marked_range payload sweeps (SQLi / command injection / path
  #     traversal / XSS / format-string / overflow strings) aimed at
  #     specific fields. Requires the companion wordlists written next
  #     to this config - see fuzzlists/injection-payloads.txt and
  #     fuzzlists/otp-boundary.txt.
  # --------------------------------------------------------------------

  - name: "fuzz-marked-range-username-injection"
    type: fuzz
    attrs:
      - type: User-Name
        value: "<FUZZ>"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    iterations: 60          # matches injection-payloads.txt line count;
                             # raise if the wordlist grows
    strategies: [marked_range]
    fuzzlist: "client/v2/fuzzlists/injection-payloads.txt"
    baseline_response: Reject   # health-check sends the literal "<FUZZ>"
                                 # text unsubstituted as the username -
                                 # expected to fail auth
    expect_no_accept: true      # a finding here (Accept) would mean one
                                 # of the payload usernames is somehow
                                 # treated as a valid, authenticated user

  - name: "fuzz-marked-range-password-suffix-injection"
    type: fuzz
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123<FUZZ>"        # real password + injected suffix
      - type: Message-Authenticator
    iterations: 60
    strategies: [marked_range]
    fuzzlist: "client/v2/fuzzlists/injection-payloads.txt"
    baseline_response: Reject   # literal "123<FUZZ>" is not the real
                                 # password/OTP, must Reject
    expect_no_accept: true

  - name: "fuzz-marked-range-otp-boundary-flow-b"
    type: fuzz
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123<FUZZ>"        # real password + boundary/odd OTP shapes
      - type: Message-Authenticator
    iterations: 20
    strategies: [marked_range]
    fuzzlist: "client/v2/fuzzlists/otp-boundary.txt"
    baseline_response: Reject
    expect_no_accept: true   # a finding here would mean the concatenation
                              # boundary is ambiguous/exploitable (e.g. a
                              # shorter-than-expected OTP still validating,
                              # or non-numeric OTP text being accepted)
  # ==========================================================================
  # PART 2 — type: challenge  (Flow A: password -> Access-Challenge -> OTP)
  #
  # max_attempts is kept small ON PURPOSE throughout this section: OTP
  # delivery is out-of-band (app/email) against a real account, and
  # hammering it can lock out the account or spam its delivery channel.
  # Raise it only within an authorized test window against an account you
  # control. Flow B (concatenated password+OTP) has no second round-trip
  # and so cannot be tested with type: challenge - its OTP fuzzing lives
  # in 1.5 above via marked_range instead.
  # ==========================================================================

  - name: "challenge-baseline-first-factor"
    type: packet
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: Message-Authenticator
    response: Challenge   # confirms the server is in Flow A for this
                           # account before the heavier challenge
                           # scenarios below run

  - name: "challenge-otp-brute-force-sequential"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999999
    otp_digits: 6
    max_attempts: 10          # deliberately small, see warning above
    otp_order: sequential
    state_reuse: true          # does a single State keep validating across
                                # repeated wrong guesses? (ideally: no)
    timeout: 1s

  - name: "challenge-otp-brute-force-random-order"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999999
    otp_digits: 6
    max_attempts: 10
    otp_order: random          # rules out a naive "only checks sequential
                                # nearness to the real OTP" implementation
    state_reuse: true
    timeout: 1s

  - name: "challenge-state-no-reuse"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999999
    otp_digits: 6
    max_attempts: 5
    state_reuse: false          # requests a FRESH State by re-sending the
                                 # first factor between guesses, instead of
                                 # replaying the original one - checks
                                 # whether the server invalidates the old
                                 # State once a new challenge is issued
    timeout: 1s

  - name: "challenge-state-corruption-checks"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999999
    otp_digits: 6
    max_attempts: 3            # kept minimal - the interesting part here
                                # is state_checks, not the brute force
    state_checks: [bit_flip, truncate, foreign, drop]
    timeout: 1s

  - name: "challenge-otp-digit-length-mismatch-short"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999           # 3-digit guesses against a real 6-digit OTP -
    otp_digits: 3           # confirms a short/malformed-length guess is
    max_attempts: 5          # rejected outright rather than e.g. matched
    timeout: 1s              # against a truncated prefix of the real OTP

  - name: "challenge-otp-digit-length-mismatch-long"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 99999999       # 8-digit guesses against a real 6-digit OTP
    otp_digits: 8
    max_attempts: 5
    timeout: 1s

  - name: "challenge-otp-leading-zeros-range"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999           # forces every guess through 000-999, i.e.
    otp_digits: 6           # zero-padded to 6 digits ("000000".."000999") -
    max_attempts: 5          # checks the server compares the OTP as a
    timeout: 1s               # fixed-width string, not as an integer that
                               # would treat "000123" == "123"

  - name: "challenge-otp-attr-override-flow-b-style"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999999
    otp_digits: 6
    otp_attr: State          # sanity-checks that the harness/server pair
    max_attempts: 3           # actually keys the second factor off
    timeout: 1s                # User-Password as documented, not e.g. an
                                # attacker-controlled State-adjacent field -
                                # expected to behave like a no-op/failure
                                # path since the guess never reaches
                                # User-Password this way

  - name: "challenge-lockout-probe-extended"
    type: challenge
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
    otp_min: 0
    otp_max: 999999
    otp_digits: 6
    max_attempts: 25       # raise ONLY inside an authorized test window,
                            # on an account you control - this is the
                            # scenario most likely to trip lockout/rate
                            # limiting or spam the OTP delivery channel;
                            # start small and raise deliberately
    state_reuse: true
    delay: 250ms             # spread attempts out slightly so a
                              # rate-limiter keyed on request rate (rather
                              # than attempt count) has a fair chance to
                              # engage/not engage, making the NOTICE log
                              # line more meaningful
    timeout: 1s

  - name: "challenge-unknown-user-never-challenges"
    type: packet
    attrs:
      - type: User-Name
        value: "definitely-not-a-real-user-abcxyz"
      - type: User-Password
        value: "123"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: Message-Authenticator
    response: Reject   # symmetric to the unknown-user check in
                        # config.security-suite.yaml - Challenge must
                        # only ever be issued for a real username
