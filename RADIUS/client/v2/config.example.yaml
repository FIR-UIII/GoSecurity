# Example scenario config for: go run ./client/v2 -c client/v2/config.example.yaml
#
# Top-level addr/secret/timeout are defaults; any scenario may override them
# individually (leave a field empty/absent to inherit the default). An
# explicit -addr flag on the command line overrides the top-level addr here.

addr: "localhost:1812"
secret: "MyRadiusSecret123"
timeout: 5s

scenarios:
  # otp: two-round PAP+OTP chain. Round 1 sends username/password; if the
  # server answers Access-Challenge, round 2 sends `otp` (or the value of
  # the env var named by `otp_env`) as the password, echoing back State.
  # Exactly one of otp / otp_env must be set.
  - name: "otp-happy-path"
    type: otp
    username: "art"
    password: "12345"
    otp: "999999"
    # otp_env: "RADIUS_TEST_OTP"   # alternative to a literal otp: value
    response: Accept   # expected outcome to pass; also: Reject, Challenge,
                        # a full name ("Access-Accept"), or a numeric code.
                        # Omit response entirely to make no assertion.

  # raw: send a complete, hand-specified raw UDP datagram, entirely outside
  # the normal packet encoder — for malformed/malicious packet testing
  # (bad lengths, bad codes, garbage attributes, etc.). packet_hex is the
  # full packet (header + attributes) as a hex string; whitespace/newlines
  # are stripped, so a YAML block scalar can be used for long packets.
  # This example is a minimal, well-formed Access-Request with NO
  # attributes at all (Code=1, ID=5, Length=20, 16-byte authenticator) —
  # most RADIUS servers will reject it (no User-Name), which is exactly the
  # kind of edge case this mode exists to probe. Replace packet_hex with
  # your own hand-crafted bytes for real testing.
  - name: "raw-example"
    type: raw
    packet_hex: "01050014000102030405060708090a0b0c0d0e0f"
    response: Reject   # a request with no attributes at all should be
                        # rejected; if the server instead accepts it, this
                        # scenario is reported FAILED

  # fuzz: send one request per line of fuzz_file (format: "attr:value",
  # see fuzz.example.txt), built from valid seed credentials (username /
  # password below), then fire post_response_datagrams extra fire-and-forget
  # copies of that same datagram after each response.
  - name: "fuzz-password-field"
    type: fuzz
    username: "art"
    password: "12345"
    fuzz_file: "client/v2/fuzz.example.txt"
    post_response_datagrams: 2
    # response: Reject  # if set, EVERY case in fuzz_file must get this
                         # response back to pass — e.g. asserting the
                         # server rejects all of these malformed requests.
                         # Left commented out here since fuzz.example.txt's
                         # cases aren't all expected to behave identically.

  # packet: build ONE RADIUS packet entirely from an explicit attribute
  # list. Nothing is ever added automatically — in particular, NOT a
  # Message-Authenticator — so this is how you get full manual control
  # over framing, e.g. to test whether a server actually enforces
  # Message-Authenticator (this repo's .raddb/clients.conf sets
  # require_message_authenticator = no, so the answer for that test server
  # should be "no").
  #
  # This example is otherwise a genuinely valid Access-Request for
  # user "art" / password "12345" (RFC 2865 PAP-encrypted against
  # secret "MyRadiusSecret123" and the authenticator below) — just with
  # the Message-Authenticator attribute left out entirely. Since no
  # type: Message-Authenticator entry is in attrs, none gets appended.
  - name: "no-message-authenticator"
    type: packet
    code: Access-Request
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "art"
      - type: User-Password
        value: "hex:c1ca81231bf609d1d3a7704f3ba549c3"
      # length: N        # any attrs[] entry may also set an explicit
                          # length: to test a deliberately mismatched
                          # Length byte (omit for the normal 2+len(value))
    response: Accept   # this repo's .raddb/clients.conf sets
                        # require_message_authenticator = no, so a valid
                        # request missing it should still be accepted;
                        # change to Reject to assert the opposite policy
