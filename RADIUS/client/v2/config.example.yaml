# Example scenario config for: go run ./client/v2 -c client/v2/config.example.yaml
#
# Top-level addr/secret/timeout are defaults; any scenario may override them
# individually (leave a field empty/absent to inherit the default). An
# explicit -addr flag on the command line overrides the top-level addr here.

addr: "localhost:1812"
secret: "MyRadiusSecret123"
timeout: 5s

scenarios:
  # raw: send a complete, hand-specified raw UDP datagram, entirely outside
  # the normal packet encoder — for malformed/malicious packet testing
  # (bad lengths, bad codes, garbage attributes, etc.). packet_hex is the
  # full packet (header + attributes) as a hex string; whitespace/newlines
  # are stripped, so a YAML block scalar can be used for long packets.
  # This example is a minimal, well-formed Access-Request with NO
  # attributes at all (Code=1, ID=5, Length=20, 16-byte authenticator) —
  # most RADIUS servers will reject it (no User-Name), which is exactly the
  # kind of edge case this mode exists to probe. Replace packet_hex with
  # your own hand-crafted bytes for real testing.
  - name: "raw-example"
    type: raw
    packet_hex: "01050014000102030405060708090a0b0c0d0e0f"
    response: Reject   # a request with no attributes at all should be
                        # rejected; if the server instead accepts it, this
                        # scenario is reported FAILED

  # raw + response: Timeout — the opposite assertion from response: Reject
  # above: instead of expecting a specific RADIUS code back, this asserts
  # the server does NOT reply at all within the scenario's timeout. Useful
  # for a packet so malformed a well-behaved server should silently drop
  # it (e.g. a buffer-underflow probe) rather than answer with anything —
  # getting any response at all, or a network error other than a timeout,
  # both make this FAIL. This example is a Status-Server packet whose
  # 16-byte Authenticator field has been truncated to 15 bytes (shifting
  # every attribute after it left by one byte), replace packet_hex with
  # your own probe.
  - name: "truncated-authenticator"
    type: raw
    packet_hex: "0C3B002B000102030405060708090A0B0C0D0E04067F000001501200000000000000000000000000000000"
    response: Timeout

  # packet: build ONE RADIUS packet entirely from an explicit attribute
  # list. Nothing is ever added automatically — in particular, NOT a
  # Message-Authenticator — so this is how you get full manual control
  # over framing, e.g. to test whether a server actually enforces
  # Message-Authenticator (this repo's .raddb/clients.conf sets
  # require_message_authenticator = no, so the answer for that test server
  # should be "no").
  #
  # This example is otherwise a genuinely valid Access-Request for
  # user "art" / password "12345" — just with the Message-Authenticator
  # attribute left out entirely. Since no type: Message-Authenticator
  # entry is in attrs, none gets appended. User-Password's plain value
  # here is PAP-encrypted for you (RFC 2865 §5.2, against secret
  # "MyRadiusSecret123" and the authenticator below) — write hex:<...>
  # instead if you need to send an already-encrypted or deliberately
  # wrong/unencrypted value by hand.
  - name: "no-message-authenticator"
    type: packet
    code: Access-Request
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "art"
      - type: User-Password
        value: "12345"
      # length: N        # any attrs[] entry may also set an explicit
                          # length: to test a deliberately mismatched
                          # Length byte (omit for the normal 2+len(value))
    response: Accept   # this repo's .raddb/clients.conf sets
                        # require_message_authenticator = no, so a valid
                        # request missing it should still be accepted;
                        # change to Reject to assert the opposite policy

  # packet + auto Message-Authenticator + auto Request Authenticator: a
  # type: Message-Authenticator entry with no value/length is computed for
  # you (RFC 2869 HMAC-MD5 over the whole packet) — you don't have to
  # precompute and paste in a hex: value by hand. This also shows
  # NAS-IP-Address taking a normal
  # dotted-quad string: it's auto-encoded as the required 4 raw octets,
  # not sent as 9 bytes of ASCII text.
  #
  # Note there's no `authenticator:` field here at all: Status-Server (like
  # Accounting-Request) has no User-Password to justify a random Request
  # Authenticator, so RFC 5997 §3 requires it to instead be computed as
  # MD5(header + attributes + secret) — an integrity check, not random
  # data. Leaving `authenticator:` unset for one of these two codes makes
  # the tool compute it that way automatically. This repo's own FreeRADIUS
  # test config happens not to enforce that, but plenty of real servers do
  # and will otherwise reject the packet as having a "bad authenticator".
  - name: "status-with-message-authenticator"
    type: packet
    code: Status-Server
    attrs:
      - type: NAS-IP-Address
        value: 127.0.0.1
      - type: Message-Authenticator
    response: Accept   # this repo's .raddb/clients.conf sets
                        # require_message_authenticator = no, so a valid,
                        # correctly authenticated Status-Server request
                        # should be accepted

  # fuzz: structural attribute fuzzer. Takes the same seed-packet fields as
  # type: packet (this is the same genuinely valid "art"/"12345" PAP
  # request as the no-message-authenticator example above) and sends
  # `iterations` mutated variants of it, round-robining through every
  # registered mutator (length lies, duplicated/missing/oversized/empty
  # attributes, unknown types, bit flips, truncation, a tampered
  # Message-Authenticator). The seed itself is sent unmutated first as a
  # health-check (must come back Accept) and again every
  # healthcheck_every iterations, to catch the server dying/hanging
  # partway through. Any mutated packet that still comes back
  # Access-Accept is logged as a finding and fails the scenario.
  - name: "fuzz-attrs-example"
    type: fuzz
    authenticator: "000102030405060708090a0b0c0d0e0f"
    attrs:
      - type: User-Name
        value: "art"
      - type: User-Password
        value: "12345"
    iterations: 100
    healthcheck_every: 20
    # seed: 1234567890         # set this to reproduce a specific run exactly
    # strategies: [length_mismatch, bit_flip, truncate]   # omit for all mutators

  # challenge: stateful Access-Challenge/OTP fuzzer. Sends the attrs below
  # as a FIRST Access-Request that must get an Access-Challenge back, then
  # brute-forces a numeric OTP against the returned State. This repo's own
  # FreeRADIUS test config (.raddb/authorize) doesn't actually run an
  # OTP/challenge module for "art" — a plain PAP user — so running this
  # against the docker test server will fail fast at "expected
  # Access-Challenge, got code 3 (Access-Reject)"; that failure is itself
  # the correct, expected outcome for this test server. This example
  # exists to demonstrate the schema against a server that does issue
  # Access-Challenge + State for OTP login.
  - name: "otp-bruteforce-example"
    type: challenge
    attrs:
      - type: User-Name
        value: "art"
    otp_min: 0
    otp_max: 999999
    max_attempts: 50     # kept small here deliberately; raise for a real brute-force run
    state_checks: [bit_flip, drop]
