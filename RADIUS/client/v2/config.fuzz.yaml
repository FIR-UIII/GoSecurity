# Security test suite for a real target RADIUS server: plain PAP over
# bare UDP (no RadSec/TLS), Message-Authenticator supported, and
# Access-Challenge/OTP supported (OTP delivered out-of-band via app or
# email). This is a DIFFERENT target than config.example.yaml's local
# docker FreeRADIUS ("art"/"12345") — fill in the real addr/secret below,
# and only run this against a server/account you're authorized to test.
#
# See client/v2/README.md for the full schema of each scenario type
# (raw | packet | fuzz | challenge).

addr: "localhost:1812"
secret: "MyRadiusSecret123"
timeout: 5s   # if this server silently drops malformed/rejected mutations
              # (no reply at all) rather than answering Reject, each one
              # burns this full wait — 300 iterations of mostly-timeouts
              # at 5s each is 25 minutes. Lower this (e.g. 1s) once you've
              # confirmed how fast a normal Reject actually comes back.

scenarios:
  # ============================================================
  # Structural attribute fuzzing (see fuzz.go for the mutator list)
  # ============================================================
  - name: "fuzz-full-suite"
    type: fuzz
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    iterations: 300
    healthcheck_every: 30
    baseline_response: Challenge   # this server always challenges a valid
                                    # first request (OTP-only flow) — it
                                    # never returns a direct Accept, so the
                                    # health-check needs to expect Challenge
                                    # instead of the default Accept
    # seed: 1234567890   # set this to reproduce a specific run exactly

  - name: "fuzz-message-authenticator-only"
    type: fuzz
    attrs:
      - type: User-Name
        value: "radsectest01"
      - type: NAS-Identifier
        value: "RADIUStesting:radiussectest"
      - type: User-Password
        value: "123"
      - type: Message-Authenticator
    iterations: 100
    strategies: [length_mismatch]
    target: User-Password
    healthcheck_every: 20
    baseline_response: Challenge
    # pair this with external timing measurements (e.g. wrap the run and
    # log response latency per iteration) to check for a non-constant-time
    # Message-Authenticator comparison on the server
